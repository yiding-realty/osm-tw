name: 每月更新開放街圖資料
on:
  schedule:
    - cron: '17 19 1 * *'   # 每月 2 日台灣時間 03:17
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['build.py', 'corrections.json', 'heritage.txt']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium==4.3.1
      - name: 下載台灣開放街圖資料
        run: curl -sSfL --retry 3 -o taiwan.osm.pbf https://download.geofabrik.de/asia/taiwan-latest.osm.pbf && ls -lh taiwan.osm.pbf
      - name: 產生分塊檔
        run: python build.py taiwan.osm.pbf site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
